<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Philipp Borucki">
  <style>
    circle { fill: none; stroke: #000000; }
    .dot { fill: #000000; stroke: none; }
    @media (prefers-color-scheme: dark) {
      circle { stroke: #f2f2f2; }
      .dot { fill: #f2f2f2; }
    }
  </style>
  <circle cx="16" cy="16" r="14" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="9" stroke-width="1"/>
  <circle class="dot" cx="16" cy="16" r="3"/>
</svg>
